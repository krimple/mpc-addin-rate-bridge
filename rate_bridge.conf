# MPC Rate Bridge settings. Read when MPC starts (restart MPC after a change).
# 0 = do nothing (every audio device opens as without the addin)
enabled=1
# empty = any USB audio card that has no 44.1 kHz; or a list of card ids or numbers to bridge (others are left alone),
# e.g. cards=mini   (ids are in /proc/asound/cards, in [brackets])
cards=
# one line per examined or bridged device in rate_bridge.log next to this file
log=1
# at MPC's start, reset a saved startup audio device that this addin bridges to MPC's own audio: MPC crashes at every start
# when it is saved (a crash loop). 0 = leave MPC.settings alone
guard=1
# the file the guard checks
settings=/data/Settings/MPC/MPC.settings
